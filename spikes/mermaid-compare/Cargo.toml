[package]
name = "mermaid-compare"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
rusty-mermaid = { version = "=0.2.0", features = ["svg"] }
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-kit = { version = "=0.15.1", default-features = false, features = ["embedded-fonts"] }
typst-render = "=0.15.1"
usvg = "=0.45.1"
png = "0.17"
