[workspace]
resolver = "3"
members = [
    "crates/markloom-core",
    "crates/markloom-style",
    "crates/markloom-mermaid",
    "crates/markloom-typeset",
    "crates/markloom-docx",
    "crates/markloom-app",
]
exclude = ["spikes/preview-latency", "spikes/mermaid-compare"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
comrak = "=0.57.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
serde-saphyr = "=2.0.0"
typst = "=0.15.1"
typst-pdf = "=0.15.1"
typst-render = "=0.15.1"
typst-layout = "=0.15.1"
typst-ide = "=0.15.1"
# Plan names `fonts` and `embed-fonts` do not exist on typst-kit 0.15.1.
typst-kit = { version = "=0.15.1", default-features = false, features = ["embedded-fonts"] }
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
insta = "=1.49.0"
usvg = "=0.45.1"
png = "0.17"
docx-rs = "=0.4.22"
resvg = "=0.45.1"
gpui-kit = { version = "=0.8.0", features = ["tree-sitter-markdown", "tree-sitter-markdown-inline"] }
notify = "=8.2.1"
trash = "=5.2.9"
zip = "=2.6.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
