[package]
name = "markloom-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
image = "=0.25.10"
markloom-core = { path = "../markloom-core" }
markloom-docx = { path = "../markloom-docx" }
markloom-mermaid = { path = "../markloom-mermaid" }
markloom-style = { path = "../markloom-style" }
markloom-typeset = { path = "../markloom-typeset" }
notify.workspace = true
png.workspace = true
serde.workspace = true
toml.workspace = true
trash.workspace = true

[dev-dependencies]
# `#[gpui_kit::test]` expands to `gpui::TestAppContext`. Depending on gpui-pre
# here turns that name on for the test crate and enables `test-support` on the
# same gpui the library already uses. gpui-kit's own `test-support` feature also
# pulls gpui-fast, whose cocoa pin does not match this lockfile.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
proptest = { version = "=1.12.0", features = ["attr-macro"] }
